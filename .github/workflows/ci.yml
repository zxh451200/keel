# Keel CI — 阶段 0 交付：门禁可复现 + 依赖治理 + 密钥扫描（需求文档 §7.3、§7.4、§9.1）
#
# 供应链约定：
#   - Action 一律固定到完整 commit SHA（行尾注释标版本号），Dependabot 负责跟进升级。
#   - 第三方二进制固定版本 + 下载后校验 SHA-256，不固定 URL 的脚本一律不执行。
#   - 这个工作流只读源码、不持任何发布/签名凭据；签名与发布属于阶段 4 的独立工作流。
#   - Rust 工具链由仓库根的 rust-toolchain.toml 固定；Flutter 版本在下方 env 固定，
#     与 AGENTS.md §0 记录的已验证版本一致，升级单独提交并测试。
#
# 退出码约定：scripts/security-check.sh 返回 3 表示「无违规但公告库取不到、未完成判定」，
# 在本工作流里同样判失败（fail closed），不放行。

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.8"
  FRB_CODEGEN_VERSION: "2.13.0"
  OSV_SCANNER_VERSION: "2.7.0"
  # 官方发布物摘要（osv-scanner_SHA256SUMS / gitleaks_checksums.txt 一致口径）
  OSV_SCANNER_WINDOWS_SHA256: "9964ed64ec9a387391eb4cc006ad5c531154821aef29b793e02c448de4686438"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_WINDOWS_SHA256: "d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e"

jobs:
  windows:
    name: Windows 门禁（构建 / 桥接 / 依赖治理）
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks 需要完整历史

      - name: Rust 工具链（rust-toolchain.toml 固定）
        run: |
          rustup show
          rustup component add rustfmt clippy

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 记录工具链版本（供应链台账）
        run: |
          rustc -vV
          cargo -V
          cargo fmt --version
          cargo clippy --version
          flutter --version

      - name: Dart 依赖
        run: flutter pub get --enforce-lockfile

      - name: 本地化生成物（ARB -> AppLocalizations，不入库）
        run: flutter gen-l10n

      - name: 桥接生成物可复现
        run: |
          cargo install flutter_rust_bridge_codegen --version "${FRB_CODEGEN_VERSION}" --locked
          flutter_rust_bridge_codegen generate
          python3 -B scripts/check_sources.py
          if ! git diff --exit-code -- lib/src/rust rust/src/frb_generated.rs; then
            echo "::error::生成物与提交不一致：改过 rust/src/api 后必须本地重跑 codegen 并提交生成物（AGENTS.md §10）"
            git status --short
            exit 1
          fi
          generated_status="$(git status --porcelain --untracked-files=all -- lib/src/rust rust/src/frb_generated.rs pubspec.lock rust/Cargo.lock)"
          if [[ -n "$generated_status" ]]; then
            echo "::error::生成物或锁文件有未提交差异（含新增文件）。"
            printf '%s\n' "$generated_status"
            exit 1
          fi

      - name: Rust 门禁
        working-directory: rust
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Dart 门禁
        run: |
          dart format --set-exit-if-changed lib test integration_test
          flutter analyze
          flutter test

      - name: 桥接端到端（真实加载 Rust 动态库）
        shell: pwsh
        run: ./scripts/integration-check.ps1 -Device windows

      - name: 构建及集成测试后检查锁文件与生成物
        run: |
          git diff --exit-code -- lib/src/rust rust/src/frb_generated.rs pubspec.lock rust/Cargo.lock
          generated_status="$(git status --porcelain --untracked-files=all -- lib/src/rust rust/src/frb_generated.rs pubspec.lock rust/Cargo.lock)"
          if [[ -n "$generated_status" ]]; then
            echo "::error::构建或集成测试改变了生成物或锁文件。"
            printf '%s\n' "$generated_status"
            exit 1
          fi

      - name: 依赖治理工具（cargo install --locked，来源 crates.io）
        working-directory: rust
        run: cargo install cargo-license cargo-deny cargo-audit --locked

      - name: 固定版本的扫描二进制（校验 SHA-256 后加入 PATH）
        run: |
          set -euo pipefail
          # RUNNER_TEMP 在 Windows runner 上是 D:\a\_temp 这种反斜杠路径，
          # 先统一转成 Git Bash 的 POSIX 路径再拼；写回 GITHUB_PATH 时反过来转成 Windows 路径。
          tools="$(cygpath -u "$RUNNER_TEMP")/keel-tools"
          mkdir -p "$tools"

          curl -sSLf --retry 3 -o "$tools/osv-scanner.exe" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_windows_amd64.exe"
          ( cd "$tools" && printf '%s  %s\n' "$OSV_SCANNER_WINDOWS_SHA256" osv-scanner.exe | sha256sum -c - )

          curl -sSLf --retry 3 -o "$tools/gitleaks.zip" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_windows_x64.zip"
          ( cd "$tools" && printf '%s  %s\n' "$GITLEAKS_WINDOWS_SHA256" gitleaks.zip | sha256sum -c - )
          unzip -q -o "$tools/gitleaks.zip" gitleaks.exe -d "$tools"

          echo "$(cygpath -w "$tools")" >> "$GITHUB_PATH"
          "$tools/osv-scanner.exe" --version
          "$tools/gitleaks.exe" version

      - name: 许可证 / 来源 / 重复依赖 / RustSec 公告 / OSV / 密钥扫描
        run: bash scripts/security-check.sh --strict

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-reports
          path: build/reports/
          if-no-files-found: warn
          retention-days: 30

  linux-desktop:
    name: Linux 桌面门禁（Flutter 构建 / 真实桥接）
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PUB_HOSTED_URL: https://pub.dev
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com
      GDK_BACKEND: x11
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 检查 runner 自带 PowerShell（缺失即失败）
        run: |
          if ! command -v pwsh >/dev/null 2>&1; then
            echo "::error::Ubuntu runner 缺少 pwsh，无法运行隔离桥接脚本；请核对 runner 镜像。"
            exit 1
          fi
          pwsh -NoLogo -NoProfile -Command '$PSVersionTable'

      - name: Linux 原生构建与无头显示依赖（仅安装到 CI runner）
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential clang cmake ninja-build pkg-config \
            libgtk-3-dev libstdc++-12-dev libssl-dev \
            libegl1-mesa-dev libgl1-mesa-dri libglu1-mesa \
            xvfb xauth dbus-x11 fonts-noto-core fonts-noto-cjk \
            curl git unzip xz-utils zip

      - name: Rust 工具链（rust-toolchain.toml 固定）
        run: rustup show

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 启用 Linux 桌面并记录工具链
        run: |
          flutter config --enable-linux-desktop
          rustc -vV
          cargo -V
          flutter --version
          clang --version
          cmake --version
          ninja --version
          pkg-config --modversion gtk+-3.0

      - name: 按锁文件获取依赖（不自动更新锁文件）
        run: |
          flutter pub get --enforce-lockfile
          cargo fetch --manifest-path rust/Cargo.toml --locked

      - name: 本地化与桥接生成
        run: |
          flutter gen-l10n
          cargo install flutter_rust_bridge_codegen --version "${FRB_CODEGEN_VERSION}" --locked
          flutter_rust_bridge_codegen generate

      # l10n outputs are ignored and must be generated before this check.
      - name: 源码与生成资源一致性
        run: python3 -B scripts/check_sources.py

      - name: 生成物与锁文件差异门禁（含未跟踪文件）
        run: |
          git diff --exit-code -- lib/src/rust rust/src/frb_generated.rs pubspec.lock rust/Cargo.lock
          generated_status="$(git status --porcelain --untracked-files=all -- lib/src/rust rust/src/frb_generated.rs pubspec.lock rust/Cargo.lock)"
          if [[ -n "$generated_status" ]]; then
            echo "::error::桥接生成物或锁文件与提交不一致；请在开发环境生成、核对并提交。"
            printf '%s\n' "$generated_status"
            exit 1
          fi

      - name: Dart 门禁
        run: |
          dart format --output=none --set-exit-if-changed lib test integration_test
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Flutter Linux Release 构建（含 Rust 动态库）
        run: flutter build linux --release --no-pub

      - name: Xvfb 桥接端到端（逐 entry 隔离进程与数据目录）
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24 -nolisten tcp" \
            dbus-run-session -- \
            pwsh -NoLogo -NoProfile -File scripts/integration-check.ps1 -Device linux

      - name: 构建及集成测试后再次检查生成物与锁文件
        run: |
          git diff --exit-code -- lib/src/rust rust/src/frb_generated.rs pubspec.lock rust/Cargo.lock
          generated_status="$(git status --porcelain --untracked-files=all -- lib/src/rust rust/src/frb_generated.rs pubspec.lock rust/Cargo.lock)"
          if [[ -n "$generated_status" ]]; then
            echo "::error::构建或集成测试改变了生成物或锁文件。"
            printf '%s\n' "$generated_status"
            exit 1
          fi

      - name: 保留 Linux 集成日志（失败也保留）
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-integration-smoke-reports
          path: build/reports/integration-*/
          if-no-files-found: warn
          retention-days: 30

  release-script-tests:
    name: 发布脚本离线回归
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python 标准库回归与 Shell 语法
        run: |
          python3 -B -m unittest discover -s scripts/tests -p 'test_*.py' -v
          bash -n scripts/security-check.sh
      - name: 隔离集成执行器回归（假 Flutter，不是桌面验收）
        shell: pwsh
        run: ./scripts/tests/test_integration_check.ps1

  linux-rust:
    name: Linux 门禁（Rust 层可移植性冒烟）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust 工具链（rust-toolchain.toml 固定）
        run: |
          rustup show
          rustup component add rustfmt clippy

      - name: Rust 门禁
        working-directory: rust
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo test
