[package]
name = "rust_lib_keel"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
# 异步 API 的定时器；runtime 由 flutter_rust_bridge 创建并持有。
tokio = { version = "1.34.0", features = ["time"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
