[package]
name = "rust_lib_keel"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
# rlib 供独立 Rust 集成测试引用；桌面桥接继续使用 cdylib/staticlib。
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
# 异步 API 的定时器与数据库初始化锁；runtime 由 flutter_rust_bridge 创建并持有。
tokio = { version = "1.34.0", features = ["time", "sync"] }
# 版本化配置文件的读写。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite 数据访问。运行时 SQL（query / query_as），不用编译期检查的 query! 宏；
# macros 特性只为 migrate!（把 migrations/ 嵌进程序）和 FromRow 派生。
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
# 登录口令只存 Argon2id 校验值（MIT OR Apache-2.0），不存明文。
argon2 = { version = "0.5", features = ["std"] }
# 结构化日志，写入按天滚动的文件。
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
tokio = { version = "1.34.0", features = ["macros", "rt-multi-thread", "time"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
